services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cem
      POSTGRES_PASSWORD: cem
      POSTGRES_DB: cem
    ports:
      - "5432:5432"
    volumes:
      - cem_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cem_postgres_data:
